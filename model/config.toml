[assets]
enabled = true
dir = "assets"
hdri = "kloofendal_48d_partly_cloudy_puresky"   # Poly Haven, CC0
hdri_res = "2k"
hdri_strength = 0.9
hdri_rotation_deg = 0.0
model_turn = {}                  # per-model extra rotation (deg); frames face front as authored (their placeholder card is replaced with generated prints)
model_res = "1k"                 # Poly Haven glTF texture resolution (4 GB GPU: keep 1k)
texture_res = "1K"               # ambientCG PBR set resolution
polyhaven_models = ["sofa_03", "mid_century_lounge_chair", "modern_coffee_table_01", "side_table_01", "throw_pillows_01",
                    "gallinera_table", "gallinera_chair", "painted_wooden_nightstand", "modern_wooden_cabinet",
