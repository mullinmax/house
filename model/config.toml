[clerestory]                    # 8 x W30-30 awning, 4'-10 1/2" o.c. (A-12)
count = 8
first_center_x = 4.5
spacing = 4.875
width = 3.0
sill = 16.0                     # A-20 south elevation
head = 19.0
# Openings through the clerestory wall at floor level (A-11): [x_start, x_end, head]
# First (pantry) opening narrowed from A-11 [0.5, 4.414] to fit a 2'-6" door that stops 2" short of the fridge panel. ASSUMED
# Mudroom cubby and entry closet (Maxwell 11/17/2026): the partition between them moved 6" west (closet 2'-6 1/2" to 3'-0 1/2"
# inside, cubby 8'-1" to 7'-7"), and the closet door is now 2'-6" x 8'-0", the same height as the cubby opening. Was [31.581, 39.664, 8.0], [40.164, 42.289, 6.67]
passages = [[0.743, 3.443, 6.67],[12.122, 16.206, 8.0], [20.914, 26.914, 8.0], [31.581, 39.164, 8.0], [39.56, 42.289, 8.0]]

[entry_closet]                  # Maxwell's builder, 11/19/2026: the (2) LVL beam over the mudroom cubby (S-11) needs two 2x4 posts under its
# east end, beside the closet, so the closet opening shrinks to 18 in (hinge jamb kept on the east). Closet inside stays 3'-0" x 1'-6".
style = "open"                  # open (Maxwell 11/19/2026: no closet, the cubby runs to a 6 in post wall at the east wall) | coat (Maxwell 11/19/2026: B as a coat cabinet) | cabinet (built-in, shelves) | closet (oak door) | pullout (pull-out coat tower) | split (door + cabinet above)
open_to = 42.0                  # open style: the cubby's east jamb, 6 in short of the east wall's inside face (42.5) for (3) 2x4 posts under its header
open_post_plies = 3
open_bench = { x = 36.79, w = 10.34, bays = 4, hooks = 7, cubbies = 3, glass_doors = 10, cull_old = [31.55, 33.05, 42.1, 34.65, 8.0] }   # unit runs 31.62 to 41.96
rod_z = 5.6                     # coat rod height
merge_cubby = true              # no oak trim between the cubby and the built-in: one piece, wall strip faced in sage (Maxwell 11/19/2026)
opening = [39.56, 42.289]       # clear opening, plan x, from just east of the posts to the east wall (Maxwell 11/19/2026: take out most of the
                                # wall to the cubby, so coats go in and out easily). The passage above must match it. Was 18 in, [40.789, 42.289]
interior = [39.227, 42.497, 33.116, 34.616]   # closet inside faces: x0 (the divider panel), x1, y0 (back), y1 (clerestory wall north face). Was 39.501 at the old partition
divider = [39.164, 39.227]      # Maxwell 11/19/2026: no wall between the cubby and the coat cabinet (not structural, the header carries it): a 3/4 in panel
divider_top = 7.98
posts = [39.164, 39.414]        # (2) 2x4 posts, plan x, under the beam end at the cubby's east jamb. ASSUMED position
post_top = 8.0                  # underside of the beam (cubby opening head)
split_at = 6.67                 # split style: door head, cabinet above it

[plan_edits]                    # interior walls moved from where A-11 draws them, by decision
# at = a plan point inside the wall (ft, as traced), dx/dy = how far it moves
wall_shift = [ { at = [39.81, 34.0], dx = -0.5, note = "cubby / entry closet partition, 6 in west so the closet is wider (Maxwell 11/17/2026)" },
               # bedroom 1 door wall, 2 ft 1 1/2 in east (Maxwell 11/19/2026, the builder can move it): the study's south wall then has room for two
               # return stacks between its door and that wall, each in its own floor truss bay (27.7 and 29.7 on the ASSUMED 24 in truss grid)
               { at = [28.25, 11.2], dx = 2.13, note = "bedroom 1 door wall, north end" },
               { at = [28.25, 14.8], dx = 2.13, note = "bedroom 1 door wall, south end" } ]
wall_remove = [ { at = [39.31, 34.0], note = "that partition is gone: a 3/4 in panel of the coat cabinet divides it from the cubby ([entry_closet] divider, Maxwell 11/19/2026)" } ]

[barn_door]                     # living room "large French barn door" (Maxwell 11/12/2026), D60-80 on A-11
