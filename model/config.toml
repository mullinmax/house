# Heilman-Mullin Residence, 1671 State Route 343
# Single source of truth for the 3D model. Edit a value, then rebuild:
#   python model/make_house.py          (walkthrough house, site/models/house.json)
#   python model/make_equipment.py      (appliances, equipment, ducts, site/models/equipment.json)
# Units are FEET unless noted. Plan origin = outside NW corner of the house slab,
# +x = east, +y = SOUTH (same as reading the plan sheet), z = height above slab.
# Source for every number is noted. "ASSUMED" means not on the plans yet: confirm or change.

[project]
name = "Heilman-Mullin Residence"
plan_set = "Moonlight Architecture sealed set 06/14/2026"
true_north_offset_deg = 0.0     # drone photos show plan north = true north within ~0.5 deg

# ---------------------------------------------------------------- HOUSE SHELL
[house]
width_x = 43.0833               # 43'-1" (A-11)
depth_y = 52.0                  # 52'-0" (A-11)
ext_wall_thickness = 0.5417     # 6-1/2" SIP (A-11 notes)
int_wall_source = "data/traced_geometry.json"   # interior walls pulled from A-11 vector data
slab_thickness = 0.333

[roof]
north_wall_height = 9.0         # 9'-0" panel height (A-30)
north_pitch = 3.82              # rise per 12. Was 3.88 on A-30, revised 9/15/2026 (Andy Roehl email)
clerestory_wall_y = 34.616      # north face of the clerestory bearing wall (A-11 / A-12)
south_wall_height = 11.0        # 11'-0" panel height (A-30)
south_pitch = 2.0               # 2:12 (A-13)
panel_thickness = 0.854         # 10-1/4" roof SIP (A-13)
overhang = 1.0                  # 12" O.H. (A-13)
fascia_height = 1.0             # 12" fascia (A-20 notes)
roofing = "standing_seam"       # standing seam metal (Maxwell)
seam_spacing_in = 16.0          # ASSUMED 16" panels, 1" ribs

[ceilings]
flat_height = 9.0               # 9'-0" CLG rooms (A-11). Everything else is vaulted to the roof.
# [x_min, y_min, x_max, y_max] for each flat 9' ceiling room
flat_rooms = [
  [0.5, 10.95, 12.12, 22.41],   # Bed 3
  [12.12, 10.95, 23.4, 15.03],  # Hall 2
  [23.4, 10.95, 30.25, 15.03],  # Hall 2 east leg to the master bedroom door: 9' ceiling + attic over it (Maxwell 11/13). Stops at bedroom 1's west wall, moved from x 28.12 to 30.25 (Maxwell 11/19/2026)
  # South edges at 22.86, just behind the living room's north wall face (22.866): at 22.87 the ceiling and attic deck poked
  # through that wall into the living room (Maxwell, 11/19/2026)
  [12.12, 15.03, 16.66, 22.86], # Hall 2 / linen
  [16.66, 15.03, 28.12, 22.86], # Laundry (mech platform above)
  [28.12, 15.49, 31.12, 22.86], # Laundry east end, south of bedroom 1's south wall (y 15.03-15.49)
  [31.12, 15.49, 42.5, 22.86],  # Closet 1. Starts at the attic side of bedroom 1's south wall: from 15.03 the deck showed through the bedroom's vaulted wall (Maxwell, 11/18/2026)
  [0.5, 22.86, 12.12, 29.03],   # Utility
  [0.5, 29.03, 12.12, 34.62],   # Pantry + Powder
]
attic_floor = true              # walkable attic deck on top of every flat ceiling; decks bridge over walls between flat rooms (one attic). ASSUMED
walls_stop_at_attic = true      # interior walls with flat ceilings on both sides stop at the attic deck (Maxwell 11/13)

[floor_trusses]                 # open web floor trusses under the attic deck and the loft (builder's choice, so returns can be ducted)
depth_in = 11.875               # 11-7/8" (Maxwell 11/16/2026)
deck_in = 0.75                  # ASSUMED 3/4" decking
spacing_in = 16.0               # MEASURED by Maxwell 11/20/2026: 16 in on centre (was ASSUMED 24)
span = "ns"                     # north to south: Maxwell 11/20/2026 lays them out from the west wall eastward
max_round_duct_in = 7.0        # largest round duct through the webs. Maxwell measured a web opening 11/20/2026: inside 19.5 in base, 13 in legs, 8.5 in high, so a 7.4 in circle fits; 7 in round passes
grid_x0 = 0.656                 # Maxwell 11/20/2026: the westernmost truss sits tight to the west wall's SIP plywood (face 0.542 + half a 2.5 in chord + 1/8 in), every truss on one 16 in grid from here
chord_w_in = 2.5                # Maxwell 11/20/2026: top and bottom chords 2.5 in wide
web_in = 1.5                    # webs 1.5 x 1.5 in (Maxwell 11/20/2026)
web_pitch_in = 21.0             # one web triangle along the chord: 19.5 in inside plus the webs (Maxwell 11/20/2026)
extra_x = [42.427]              # Maxwell 11/20/2026: a second truss tight to the east wall's SIP plywood, about 4 in from the last one on the grid
solid_ends = [ [0, 0, 10.95, 30.0], [1, 8, 10.95, 7.0], [9, 17, 10.95, 32.0], [18, 20, 10.95, 7.0], [21, 30, 15.41, 25.0], [31, 31, 15.41, 89.4], [23, 31, 34.846, -12.0], [0, 8, 34.616, -9.0] ]   # Maxwell 11/20/2026: solid trimmable ends at the hall 2 north wall (south face y 10.95). [first truss, last truss] counted from the west (0 = the one on the west wall), wall face y, inches they reach south. The truss on the west wall reaches 2 ft 6 in (Maxwell first left it out of his count), then 8 reach 7 in, 9 reach 2 ft 8 in, 3 reach 7 in; the web triangles still line up across all of them. Over bedroom 1 / closet 1 (Maxwell, 11/20/2026, measured from the south face of the laundry / bedroom 1 wall framing, y 15.41, no drywall): 10 trusses reach 2 ft 1 in, the second to last is solid its whole length to the closet 1 south wall, the last one (extra_x) reaches 2 ft 1 in.. A negative length reaches north: the south ends of the 9 grid trusses over the utility, pantry and powder room are solid 9 in north of the clerestory wall (north face 34.616), and the south ends of the 10 trusses from bedroom 1 over the loft are solid 1 ft north of the entry cubby header's back face (header 3 3/4 in thick, flush to the clerestory wall's south face 35.158, so its back is at y 34.846; Maxwell 11/20/2026)
solid_ends_x = [ [42.427, 15.41, 25.0], [42.427, 34.846, -12.0], [11.89, 22.86, 7.0] ]   # the east wall truss, like its neighbours; the truss on the hall 1 west wall: 7 in solid from its north end (it ends at a web peak), none at its south end (Maxwell 11/20/2026)
extra_trusses = [ [11.89, 22.86, 34.62] ]   # Maxwell 11/20/2026: one more truss over the utility and powder room, right on the top plate of their east wall (the hall 1 west wall, x 11.89), off the 16 in grid. It starts at the south face of the hall 1 pocket door framing (y 22.87), on three 2x4s that frame that door (Maxwell 11/20/2026)   # the east wall truss, like its neighbours (Maxwell 11/20/2026)

[loft]                          # 134 sf loft over Bath 1 (A-12)
enabled = true
rect = [31.12, 22.87, 42.5, 34.62]
floor_height = 10.052           # 9' plate + 11-7/8" open web trusses + 3/4" subfloor (Maxwell 11/16/2026). Was 9.9 with the 2x10 floor on A-30
pony_wall_height = 0.0          # Maxwell 11/13: wall stops level with the loft floor (A-12 showed a high pony wall), railing above
railing = true                  # 36" guard along the open loft edge. ASSUMED
railing_height = 3.0
railing_style = "steel_oak"     # black steel posts and balusters, white oak cap. ASSUMED
ships_ladder = [25.828, 31.92, 31.12, 34.48]   # [x0, y0, x1, y1]: x0 is the first riser, x1 the bath 1 west wall it lands on. Steepest ships ladder the RCO / IRC R311.7.12 allows (Maxwell 11/21/2026): 13 risers (9.5 in max), 5 in going (min), 8.5 in treads (tread + nosing min), so x1 - x0 = 12 x 5 in + 3.5 in landing nosing. Was [27.7, 32.0, 31.12, 34.56] on A-11 (11 treads, 10 in risers, 3.7 in going: not to code). Moved 1 in north so the wall side handrail clears the clerestory wall by 1.5 in
ladder_design = "corner"          # Maxwell 11/21/2026: narrow ships ladder (24 in overall, 20 3/8 in clear) east along the south wall from just inside the living room opening's jamb, a landing in the south east corner, then north along the bath 1 wall to a balcony at loft level. "code" = the straight ladder above (its foot stood 13 in past the jamb). Other mockups in model/ladder_options.py: pullout, flip, lturn, side, winder, alt
furniture = "chest"               # loft furniture, placement ASSUMED (Maxwell 11/21/2026): loveseat on the north wall, compact wood console piano on the south wall, swivel armchair, a full size cabinet bed (Arason Creden-ZzZ, 58 x 23 x 39 in, opens to 76 in) in the south east corner, and bookshelves along the east wall framing the window with a sit on top under it. No 6 ft table (it filled the room). "sleeper" is the alternative mockup: one IKEA FRIHETEN sleeper sofa under the east window instead of the loveseat and the cabinet bed. "none" leaves the loft empty; bed_open = true draws the bed down
ladder_risers = 13
ladder_lower_risers = 5           # corner design: risers up to the corner landing. 4 (three treads before the landing, Maxwell's 11/21/2026 mockup) lowers the landing to 3'-1 1/8" and frees 5 in, which widens the ladder
ladder_width_in = 24.45           # corner design: overall width. Was 24 with housed oak stringers (20 3/8 in clear). 24.45 with the 3/4 in wall gap keeps the foot where it was; with tube stringers under them the treads run the full width and the rails are 21 7/8 in apart
ladder_stringer = "mono"          # corner design: "mono" = ONE 4 x 4 x 1/4 in square tube under the middle of the treads, bracket pairs each side, a 2 in oak riser lip behind every tread under a 2 in steel strip (Maxwell 11/22/2026). "tube" = two 2 x 3 tubes under the tread ends
ladder_mono_in = [4.0, 4.0]       # mono stringer width and depth
ladder_landing_nosing_in = 0.0    # corner design: oak nosing past the landing and balcony edges. 0 = each platform's own edge is the top nosing, so the foot sits 3 1/2 in further from the living room opening and the balcony 3 1/2 in further south (Maxwell 11/22/2026). Remove for the 3 1/2 in lips
ladder_rail_continuous = false  # open side rail: true = round 3's one continuous curved rail; false = straight rails between the posts (Maxwell 11/24/2026: back to straight)
ladder_wall_rail = false          # wall side handrails hidden (Maxwell 11/22/2026 round 3). A ships ladder needs a rail on both sides to pass inspection (R311.7.12), so set true for the inspection drawings
#ladder_stringer = "tube"          # corner design: "tube" = stock 2 x 3 x 3/16 in rectangular steel tube stringers under the treads with laser cut tread brackets (Maxwell 11/21/2026: the plate stringers were too long for SendCutSend). Remove for the plate or oak stringers below
ladder_tube_in = [2.0, 3.0]       # tube width and depth
ladder_stringer_in = 0.375        # corner design: stringer thickness. Under 1 = black steel plates (3/8 in, Maxwell's pick 11/21/2026); 1.8 = white oak
ladder_wall_gap_in = 0.75         # corner design: ladder edge to the bath 1 wall and the clerestory wall. 3/4 in leaves room for the bolt heads and wall tabs on the wall side tubes
ladder_wall_stringer_under = false # corner design: wall side stringers under the treads. Tried 11/21/2026 and dropped: the overlapping treads leave no seat. With steel plates both stringers sit beside the treads, treads on bolt on angle clips, wall side rails on brackets, wall plates lagged to blocking
ladder_going_in = 5.0             # nosing to nosing
ladder_tread_in = 8.5             # each tread overlaps the next by 3.5 in; the loft edge gets a 3.5 in oak nosing over the top tread
ladder_tread_strips = "decor"     # round 13 (Maxwell 11/25/2026): locked in the decorative angle option (no strip structure, 1 3/4 oak on the bracket seats, 5/16 lags, a stock L 2 x 1 x 1/8 under each tread nose). false = plain no strip, true = structural strips
ladder_tread_thick_in = 1.75      # tread oak with no strips (the landing and balcony decks stay 1.44)
ladder_handrail_in = 32.0         # top of rail above the nosing line, 30 to 34 in allowed
attic_access = { east_gap = 2.05, width = 2.96, door = { top_in = 60 } }   # walk through opening in the loft north wall onto the attic deck: east edge 1 ft off the inside face of the east wall (Maxwell, 11/19/2026). Width kept from the A-11 gap (x 34.37-37.33) that used to be the way in, now walled above the loft floor. Moved 12 5/8 in west 11/21/2026 (Maxwell) so the 23 in deep bookcase in the loft's north east corner has solid wall behind it; was east_gap = 1.0. door: a short leaf (top_in above the loft floor) swinging into the attic, low enough to clear the roof when open 90 degrees (Maxwell 11/21/2026)

