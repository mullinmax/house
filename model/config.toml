# Heilman-Mullin Residence, 1671 State Route 343
# Single source of truth for the 3D model. Edit a value, then rebuild:
#   blender --background --python build_house.py -- --config config.toml
# Units are FEET unless noted. Plan origin = outside NW corner of the house slab,
# +x = east, +y = SOUTH (same as reading the plan sheet), z = height above slab.
# Source for every number is noted. "ASSUMED" means not on the plans yet: confirm or change.

[project]
name = "Heilman-Mullin Residence"
plan_set = "Moonlight Architecture sealed set 06/14/2026"
true_north_offset_deg = 0.0     # drone photos show plan north = true north within ~0.5 deg

# ---------------------------------------------------------------- HOUSE SHELL
[house]
width_x = 43.0833               # 43'-1" (A-11)
depth_y = 52.0                  # 52'-0" (A-11)
ext_wall_thickness = 0.5417     # 6-1/2" SIP (A-11 notes)
int_wall_source = "data/traced_geometry.json"   # interior walls pulled from A-11 vector data
slab_thickness = 0.333

[roof]
north_wall_height = 9.0         # 9'-0" panel height (A-30)
north_pitch = 3.82              # rise per 12. Was 3.88 on A-30, revised 9/15/2026 (Andy Roehl email)
clerestory_wall_y = 34.616      # north face of the clerestory bearing wall (A-11 / A-12)
south_wall_height = 11.0        # 11'-0" panel height (A-30)
south_pitch = 2.0               # 2:12 (A-13)
panel_thickness = 0.854         # 10-1/4" roof SIP (A-13)
overhang = 1.0                  # 12" O.H. (A-13)
fascia_height = 1.0             # 12" fascia (A-20 notes)
roofing = "standing_seam"       # standing seam metal (Maxwell)
seam_spacing_in = 16.0          # ASSUMED 16" panels, 1" ribs

[ceilings]
flat_height = 9.0               # 9'-0" CLG rooms (A-11). Everything else is vaulted to the roof.
# [x_min, y_min, x_max, y_max] for each flat 9' ceiling room
flat_rooms = [
  [0.5, 10.95, 12.12, 22.41],   # Bed 3
  [12.12, 10.95, 23.4, 15.03],  # Hall 2
  [12.12, 15.03, 16.66, 22.87], # Hall 2 / linen
  [16.66, 15.03, 31.12, 22.87], # Laundry (mech platform above)
  [31.12, 15.03, 42.5, 22.87],  # Closet 1
  [0.5, 22.87, 12.12, 29.03],   # Utility
  [0.5, 29.03, 12.12, 34.62],   # Pantry + Powder
]

[loft]                          # 134 sf loft over Bath 1 (A-12)
enabled = true
rect = [31.12, 22.87, 42.5, 34.62]
floor_height = 9.9              # 9' plate + 2x10 floor (A-30 notes)
pony_wall_height = 3.5          # "HIGH PONYWALL" (A-12)
ships_ladder = [27.7, 32.0, 31.12, 34.56]   # footprint from A-11, rises toward the east

