# ---------------------------------------------------------------- KITCHEN
# Layout follows Danielle Gross (Carter Lumber) "Design Start Plan" elevations, 11/10/2026.
# Erin's redline (11/12/2026) applied per Maxwell 11/13/2026: long pulls, 2 island drawers, drawer over the sheet pan
# pullout, one tall utensil drawer, deeper microwave upper, pantry door instead of the tall cabinet, beverage fridge
# facing the dining room, 15" seating overhang.
[kitchen]
island = [6.0, 42.52, 14.0, 46.27]      # 96" top (A-11), deepened to 45" for a 15" seating overhang (redline)
island_overhang = 1.25                   # 15" seating overhang on the north side (Erin asked for 12" or more)
island_color = "#56614A"                 # olive green as rendered by Carter. Erin's note said "soft green"
cabinet_wood = "#B29373"                 # white oak, same texture as the windows and trim (Maxwell 11/19/2026: Danielle's lighter tone read too bright). Species/stain TBD
cabinet_map = "white_oak.jpg"            # white_oak.jpg = windows and trim | cabinet_natural.jpg = Danielle's 11/19/2026 rendering (tools/make_cabinet_texture.py)
island_finish = "paint"                  # paint (olive green, island_color) | wood (same wood as the other cabinets)
counter_color = "#ECE8E0"                # ASSUMED light quartz
hardware_color = "#B8B8B4"               # brushed nickel: faucet, lever handles and appliance handles
pull_color = "#1A1A1A"                   # matte black bar pulls on every kitchen cabinet (Danielle's 11/19/2026 rendering)
wide_drawer_pulls = 1                    # Erin redline 11/12: one long pull on wide drawers (2 = Carter drawing)
upper_bottom = 4.6                       # underside of the uppers on the fridge wall (from elevation)
tall_height = 8.0                        # top of tall cabinets incl. crown (from elevation)
oven_face_bottom = 1.22                  # bottom of the wall oven's face above the floor, ft. The drawer below and the doors above fit round it.
oven_face_height_in = 50.75              # Frigidaire Gallery GCWD3067AF face height (cutout 28.5 W x 48.875 H x 23.5 D in)
# Each run: wall it backs onto, plan coordinate of that wall face, which way the fronts face,
# and units as [start, end, type] measured along the wall (x for S/N runs, y for W run).
# Types: blind, door1, doors2, drawers2, drawers3, drawer_door, drawer_doors2, dishwasher,
#        pullout, oven_tower, tall_pantry, fridge, tray, beverage, panel
[kitchen.runs.south]                     # sink wall, elevation 1
axis = "x"
back = 51.458
facing = -1
units = [[0.54, 2.6, "blind"], [2.6, 3.6, "pullout"], [3.6, 4.7, "drawers3"], [4.7, 6.2, "drawer_door"],
         [6.2, 8.3, "dishwasher"], [8.3, 11.3, "doors2"], [11.3, 14.0, "drawers3"]]
sink_x = [8.6, 11.0]
[kitchen.runs.west]                      # cooktop wall, elevation 2
axis = "y"
back = 0.5417
facing = 1
units = [[41.7, 44.5, "oven_tower"], [44.5, 45.5, "drawer_tall"], [45.5, 48.5, "drawers2"], [48.5, 49.49, "pullout_drawer"]]
cooktop_y = [45.6, 48.4]
[kitchen.runs.north]                     # fridge wall (south face of the clerestory wall), elevation 3
axis = "x"
back = 35.158
facing = 1
units = [[3.9, 7.05, "fridge"], [7.1, 9.4, "drawers3"], [9.4, 11.7, "drawer_doors2"]]
uppers = [[7.1, 9.4, "microwave", 1.5], [9.4, 11.7, "glass", 1.1]]   # [start, end, type, depth ft]; microwave upper deepened (redline). Order from Danielle's 11/19/2026 rendering: microwave by the fridge, glass at the east end
pantry_style = "flush"                   # Maxwell 11/19/2026: the deep Murphy cabinet can't swing past the fridge and wall. Options: flush (thin door dressed as tall pantry doors, swings out) | pocket (slides into the wall behind the fridge) | shelf (shallow Murphy shelf door, swings into the pantry) | murphy (the deep one, PR 53) | door (Erin's redline oak slab)
alcove_head = 6.85                       # underside of the upper cabinet over the pantry doorway (flush, pocket, shelf)
murphy_split = 4.6                       # door line on the Murphy cabinet's face, in line with the underside of the uppers
murphy_swing = 92                        # degrees it opens, hinged at the west front corner, parking along the west wall. ASSUMED
pantry_door = [0.743, 3.443]             # redline: door into the pantry where Carter drew a tall cabinet (now a Murphy door, pantry_style). Rough opening = first clerestory passage
pantry_door_leaf = 2.5                   # 2'-6" x 6'-8" white oak slab. ASSUMED (a 2'-8" leaf leaves no room for casing against the west wall)
pantry_casing_east = 0.292               # 3-1/2" casing; its outer edge stops 2" (0.167 ft) short of the fridge side panel at x = 3.9
pantry_casing_west = 0.20                # trimmed to 2-3/8" so it dies into the west wall face at x = 0.542
fridge_panels = 0.06                     # 3/4" oak side panels inside the fridge bay [3.9, 7.05], stainless unit between them. ASSUMED. Bay widened from 6.95 (36.6 in) to 7.05 (37.8 in) which leaves about 36.3 in clear between the panels. The 36 in Frigidaire Gallery GRFC2353AF (Erin's list, 11/17/2026) has under 3/16 in each side
[kitchen.runs.island]                    # island working side faces south (elevation 4)
