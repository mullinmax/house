grade_blend_ft = 25.0           # blend from the graded pad back to natural ground
lawn_radius_ft = 0.0            # Maxwell 11/13: NAIP photo right up to the house (was 90 ft of lawn shader)
lawn_blend_ft = 40.0
min_tree_height_ft = 12.0
