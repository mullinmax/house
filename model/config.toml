area_ft = 1000.0                # modeled square, feet on a side
grid_ft = 2.0                   # terrain mesh spacing
ortho_px = 2000                 # orthophoto resolution across the square
slab_top_elev_ft = 1035.51      # slab top, feet NAVD88. Was 1034.93 (lidar ground at the slab edge + 8 in); raised 7 in on 11/22/2026 so the garage slab, 8 in below the house floor, stays 4 in above the lidar ground (Maxwell OK). See [grade]. No survey
slab_reveal_ft = 0.67           # slab top above finished grade (8")
