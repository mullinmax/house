panel = "oak"                   # opaque solid white oak panels (Maxwell 11/13/2026); "glass" for glazed
lites_high = 1                  # panels stacked per leaf (rails between them). ASSUMED

# ---------------------------------------------------------------- OTHER STRUCTURES
[garage]                        # delegated design, A-11 / A-22
