cabinet_oak = "oak_veneer_01"    # 1.83 m tile: KraftMaid natural cabinets (tinted to cabinet_wood)
siding_grain = "fine_grained_wood"   # 0.6 m tile: cedar-grain emboss under the SmartSide paint
[assets.ambientcg]               # role = ambientCG asset id (CC0)
siding = "Wood026"               # wood grain under the painted SmartSide color
floor = "Concrete048"            # roughness/normal variation under the stained-concrete color
oak = "Wood058"
quartz = "Marble012"
tile_wall = "Tiles107"
tile_floor = "Tiles071"
roof = "PaintedMetal004"
curtain = "Fabric061"
bedding = "Fabric085"
rug = "Carpet016"
gravel = "Gravel043"
asphalt = "Asphalt031"
plaster = "PaintedPlaster017"
leaf_a = "LeafSet024"            # leaf atlases with opacity for the procedural hardwoods
leaf_b = "LeafSet022"
leaf_c = "LeafSet017"
leaf_d = "LeafSet019"
bark = "Bark006"
bark_b = "Bark001"

