head = 19.0
# Openings through the clerestory wall at floor level (A-11): [x_start, x_end, head]
# First (pantry) opening narrowed from A-11 [0.5, 4.414] to fit a 2'-6" door that stops 2" short of the fridge panel. ASSUMED
passages = [[0.743, 3.443, 6.67],[12.122, 16.206, 8.0], [20.914, 26.914, 8.0], [31.581, 39.664, 8.0], [40.164, 42.289, 6.67]]

[barn_door]                     # living room "large French barn door" (Maxwell 11/12/2026), D60-80 on A-11
