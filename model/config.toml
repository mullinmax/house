north_windows = [5.5, 11.5, 17.5, 23.5]      # W30-30 awnings, start from garage west
north_window_sill = 9.13        # A-21 north elevation (head 12'-1 1/2")
north_window_height = 3.0       # W30-30 = 3'-0" x 3'-0"
man_door_y = [37.9, 40.9]       # D30-68 into porch (west wall)
driveway_depth = 25.0           # 25' pad in front of the garage (A-11)
driveway_material = "Gravel"    # Maxwell 11/12/2026: driveway is gravel, not concrete

[porch]                         # covered porch, delegated design
enabled = true
rect = [43.0833, 26.7, 63.0833, 42.6]
high_height = 11.0              # ASSUMED
pitch = 2.0
posts_x = [49.75, 56.3]

[greenhouse]                    # delegated design / deferred submittal
enabled = true
rect = [0.0, 52.0, 43.0833, 72.0]
north_height = 9.5              # ASSUMED from A-20 dashed outline
south_height = 6.3              # ASSUMED

# ---------------------------------------------------------------- KITCHEN
# Layout follows Danielle Gross (Carter Lumber) "Design Start Plan" elevations, 11/10/2026.
# Erin's redline (11/12/2026) applied per Maxwell 11/13/2026: long pulls, 2 island drawers, drawer over the sheet pan
# pullout, one tall utensil drawer, deeper microwave upper, pantry door instead of the tall cabinet, beverage fridge
# facing the dining room, 15" seating overhang.
[kitchen]
island = [6.0, 42.52, 14.0, 46.27]      # 96" top (A-11), deepened to 45" for a 15" seating overhang (redline)
island_overhang = 1.25                   # 15" seating overhang on the north side (Erin asked for 12" or more)
island_color = "#56614A"                 # olive green as rendered by Carter. Erin's note said "soft green"
cabinet_wood = "#B98B5A"                 # KraftMaid natural wood as rendered by Carter (species/stain TBD)
counter_color = "#ECE8E0"                # ASSUMED light quartz
hardware_color = "#B8B8B4"               # brushed nickel bar pulls as rendered
wide_drawer_pulls = 1                    # Erin redline 11/12: one long pull on wide drawers (2 = Carter drawing)
upper_bottom = 4.6                       # underside of the uppers on the fridge wall (from elevation)
tall_height = 8.0                        # top of tall cabinets incl. crown (from elevation)
# Each run: wall it backs onto, plan coordinate of that wall face, which way the fronts face,
# and units as [start, end, type] measured along the wall (x for S/N runs, y for W run).
# Types: blind, door1, doors2, drawers2, drawers3, drawer_door, drawer_doors2, dishwasher,
#        pullout, oven_tower, tall_pantry, fridge, tray, beverage, panel
[kitchen.runs.south]                     # sink wall, elevation 1
axis = "x"
back = 51.458
facing = -1
units = [[0.54, 2.6, "blind"], [2.6, 3.6, "pullout"], [3.6, 4.7, "drawers3"], [4.7, 6.2, "drawer_door"],
         [6.2, 8.3, "dishwasher"], [8.3, 11.3, "doors2"], [11.3, 14.0, "drawers3"]]
sink_x = [8.6, 11.0]
[kitchen.runs.west]                      # cooktop wall, elevation 2
axis = "y"
back = 0.5417
facing = 1
units = [[41.7, 44.5, "oven_tower"], [44.5, 45.5, "drawer_tall"], [45.5, 48.5, "drawers2"], [48.5, 49.49, "pullout_drawer"]]
cooktop_y = [45.6, 48.4]
[kitchen.runs.north]                     # fridge wall (south face of the clerestory wall), elevation 3
axis = "x"
back = 35.158
facing = 1
units = [[3.9, 6.95, "fridge"], [7.1, 9.4, "drawers3"], [9.4, 11.7, "drawer_doors2"]]
uppers = [[7.1, 9.4, "glass", 1.1], [9.4, 11.7, "microwave", 1.5]]   # [start, end, type, depth ft]; microwave upper deepened (redline)
pantry_door = [0.743, 3.443]             # redline: door into the pantry where Carter drew a tall cabinet. Rough opening = first clerestory passage
pantry_door_leaf = 2.5                   # 2'-6" x 6'-8" white oak slab. ASSUMED (a 2'-8" leaf leaves no room for casing against the west wall)
pantry_casing_east = 0.292               # 3-1/2" casing; its outer edge stops 2" (0.167 ft) short of the fridge side panel at x = 3.9
pantry_casing_west = 0.20                # trimmed to 2-3/8" so it dies into the west wall face at x = 0.542
fridge_panels = 0.06                     # 3/4" oak side panels inside the fridge bay [3.9, 6.95], stainless unit between them. ASSUMED
[kitchen.runs.island]                    # island working side faces south (elevation 4)
axis = "x"
back = 43.77
facing = 1
depth = 2.39
units = [[6.1, 8.9, "tray"], [8.9, 11.8, "drawers2"]]
[kitchen.runs.island_east]               # beverage fridge in the east end, door facing the dining room (redline)
axis = "y"
back = 11.8
facing = 1
depth = 2.04
units = [[43.71, 43.95, "panel"], [43.95, 45.95, "beverage"], [45.95, 46.22, "panel"]]

[kitchen.shelves]                        # open white oak shelves on the sink wall, west of the window
x = [0.54, 6.7]
heights = [5.4, 6.7]
depth = 0.9

# ---------------------------------------------------------------- MATERIALS
[materials]
siding_color = "#7D8A6C"        # LP SmartSide "Garden Sage" (approximate on screen)
siding_style = "board_and_batten"
batten_spacing_in = 12.0        # ASSUMED 12" o.c.
batten_width_in = 2.5
batten_thickness_in = 0.75      # battens are modeled as real geometry
trim_color = "#1E2022"          # LP "Abyss Black"
roof_color = "#2B2D2F"          # standing seam, charcoal (Maxwell OK 11/12/2026)
window_exterior_color = "#141414"   # black clad
window_interior = "white_oak"       # natural white oak, clear topcoat. Sash, jambs and casing all oak inside; black clad shows only outside
window_grids = false
floor_color = "#7A3B26"         # red-brown "leather" stained concrete
floor_color_2 = "#5A2A1A"       # mottling
floor_gloss = 0.35              # roughness (lower = shinier sealer)
floor_cut_pattern = "diamond"   # both diagonals (Maxwell 11/12/2026)
floor_cut_spacing = 9.0        # 9' x 9' diamonds, point to point 12'-8 3/4" (Maxwell saw-cut layout)
floor_cut_origin = [23.875, 52.0]   # a diamond point sits at the rear (south) door center, 23'-10 1/2" from the west slab edge
wall_paint = "#EEEAE3"
interior_door = "white_oak"

# ---------------------------------------------------------------- BURIED UTILITIES
[utilities]
source = "data/traced_geometry.json"
geothermal_depth = 6.0          # ASSUMED typical horizontal loop depth
septic_depth = 2.0              # ASSUMED
geothermal_color = "#1E90FF"
septic_color = "#C8551E"
show_surface_markers = true     # paint the routes on the ground in renders

# ---------------------------------------------------------------- TERRAIN
# Real ground from public data (USGS 3DEP DEM + lidar, USDA NAIP photo, OpenStreetMap). Rebuild the data with
#   python make_terrain.py        (writes data/terrain/*)
# Set enabled = false to go back to the flat lawn.
[terrain]
enabled = true
lat = 39.805389                 # 39 48'19.4" N, plan sheet site coordinate
lon = -83.862139                # 83 51'43.7" W
anchor_plan_xy = [21.54, 26.0]  # ASSUMED the plan-sheet coordinate marks the house center
center_plan_xy = [21.54, 26.0]  # center of the modeled square
area_ft = 1000.0                # modeled square, feet on a side
grid_ft = 2.0                   # terrain mesh spacing
ortho_px = 2000                 # orthophoto resolution across the square
slab_top_elev_ft = 1034.93      # slab top, feet NAVD88: median natural grade at the slab edge (1034.26) + 8" reveal. ASSUMED, no survey
slab_reveal_ft = 0.67           # slab top above finished grade (8")
grade_buffer_ft = 3.0           # flat graded pad around slab / garage / porch / greenhouse
grade_blend_ft = 25.0           # blend from the graded pad back to natural ground
lawn_radius_ft = 90.0           # within this of the house, use mowed-lawn shader instead of the 2023 field photo
lawn_blend_ft = 40.0
min_tree_height_ft = 12.0
max_tree_height_ft = 95.0       # cap on lidar tree heights; 150 ft lidar hits are outliers (Maxwell: some tall trees, none that tall)
tree_min_spacing_ft = 14.0
tree_density = 1.0              # fraction of lidar-detected trees to place (0..1)
far_area_ft = 6000.0            # far ring out to the horizon: coarse DEM, NAIP photo and lidar tree tops (sparse levels)
far_grid_ft = 20.0
far_ortho_px = 3000
far_lidar_depth = 10            # deepest EPT level read for the far ring (sparse points = tree tops only)
far_tree_cell_ft = 10.0
far_tree_spacing_ft = 26.0
tree_style = "procedural"       # "procedural" hardwoods (oak, maple, ash, hickory) or "blobs" (v2 look)
tree_species = { oak = 0.35, maple = 0.30, ash = 0.15, hickory = 0.20 }   # SW Ohio woodlot mix. ASSUMED
show_osm_buildings = true
show_roads = true

# ---------------------------------------------------------------- DOLLHOUSE STILLS
[dollhouse]                     # --render dollhouse : roof and ceilings off, walls sliced at cut_height
cut_height = 9.25               # ft above slab
plan_view = true                # also a straight-down cutaway plan
plan_cut_height = 4.5           # the plan view is sliced lower so doorways show
# views = { name = [x, y, z, lens_mm], ... } in plan feet; defaults are four high corner views
# (separately, --render stills --only dollhouse_southwest,... renders the 8.6 ft cut set incl. close-ups; --cut sets its height)

