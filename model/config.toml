plot_buffer_ft = 150.0          # full-detail trees on the plot and this far around it
far_outside_keep = 0.08         # fraction of far-ring trees kept outside the plot buffer (horizon only)
skirt_color = "auto"            # ground beyond the far photo: mean colour of the photo edge
far_area_ft = 6000.0            # far ring out to the horizon: coarse DEM, NAIP photo and lidar tree tops (sparse levels)
far_grid_ft = 20.0
far_ortho_px = 3000
