<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
:root {
  --bg: #F5F6F2; --panel: rgba(245, 246, 242, 0.92); --fg: #23271F; --muted: #5E6656; --line: #D3D8CC;
  --accent: #56614A; --accent-fg: #FFFFFF; --scrim: rgba(23, 26, 21, 0.55);
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #171A15; --panel: rgba(23, 26, 21, 0.9); --fg: #E7EAE2; --muted: #A3AC98;
    --line: #33392E; --accent: #A7B88F; --accent-fg: #171A15; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #171A15; --panel: rgba(23, 26, 21, 0.9); --fg: #E7EAE2; --muted: #A3AC98;
  --line: #33392E; --accent: #A7B88F; --accent-fg: #171A15; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); touch-action: none; }
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
#panel { position: fixed; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
  width: min(300px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; display: grid; gap: 10px; backdrop-filter: blur(6px); max-height: calc(100dvh - 24px); overflow: auto; }
#panel h1 { font: 600 1.05rem var(--display); margin: 0; }
#panel .eyebrow { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button, select { font: 500 .85rem var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
select { width: 100%; background: var(--bg); }
label { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
input[type=range] { flex: 1; accent-color: var(--accent); }
.help { font-size: .78rem; color: var(--muted); margin: 0; }
.help kbd { font: 500 .72rem ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 8px 10px 10px; display: grid; gap: 8px; min-width: 0; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
details[open] { padding-bottom: 10px; }
details > summary { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; padding: 2px 0; }
details[open] > summary { margin-bottom: 8px; }
details > .row { margin-top: 8px; }
legend { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.checks input { accent-color: var(--accent); margin: 0; }
#slicelbl { font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--muted); }
fieldset > label.stack { display: grid; gap: 2px; }
#detents button { padding: 3px 8px; font-size: .78rem; }
.layers { display: grid; gap: 2px; }
.layer { display: grid; grid-template-columns: auto 18px 1fr; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
.layer:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.layer.sub { margin-left: 22px; }
.layer.off { opacity: .45; }
.layer input { accent-color: var(--accent); margin: 0; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
#modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 30; padding: 16px; }
#modal .sheet { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(980px, 100%); max-height: calc(100dvh - 32px);
  overflow: auto; padding: 14px 16px 16px; display: grid; gap: 12px; }
.mhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mhead h2 { font: 600 1.1rem var(--display); margin: 0; flex: 1; min-width: 10ch; }
#modalClose { font-size: 1.1rem; line-height: 1.2; padding: 2px 10px; }
.plan { width: 100%; height: auto; display: block; }
.plan .rm { fill: color-mix(in srgb, var(--accent) 8%, var(--bg)); stroke: var(--muted); stroke-width: .12; cursor: pointer; }
.plan .rm:hover, .plan .rm:focus { fill: color-mix(in srgb, var(--accent) 35%, var(--bg)); outline: none; }
.plan .rm.up { fill: none; stroke-dasharray: .6 .4; stroke: var(--accent); stroke-width: .2; }
.plan .rm.up:hover { fill: color-mix(in srgb, var(--accent) 25%, transparent); }
.plan .out { fill: none; stroke: var(--fg); stroke-width: .35; }
.plan text { font: 500 1.05px var(--body); fill: var(--fg); pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
.plan text.small { font-size: .8px; fill: var(--muted); }
.plan .dot { cursor: pointer; stroke: var(--bg); stroke-width: .18; }
.plan .dot:hover { stroke: var(--fg); stroke-width: .3; }
.plan .north { stroke: var(--muted); fill: none; stroke-width: .15; }
.equipgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .equipgrid { grid-template-columns: 1fr; } }
.elist { display: grid; gap: 10px; font-size: .85rem; }
.elist h3 { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
.elist h3 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.elist button { display: block; width: 100%; text-align: left; border: 0; padding: 4px 6px; }
.elist button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
.keys h3 { font: 600 .95rem var(--display); margin: 0 0 6px; }
.keys table { border-collapse: collapse; width: 100%; font-size: .85rem; }
.keys td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { width: 42%; padding-right: 10px; white-space: nowrap; }
kbd { font: 500 .75rem ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
.note { color: var(--muted); font-size: .8rem; margin: 0; }
#info { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: min(340px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  backdrop-filter: blur(6px); z-index: 5; touch-action: pan-y; }
#info .eyebrow { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
#info h2 { font: 600 1.05rem var(--display); margin: 2px 28px 4px 0; }
#info p { margin: 6px 0; }
#info .model { color: var(--muted); }
#info .price { font-weight: 500; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0; font-size: .82rem; }
#info dt { color: var(--muted); }
#info dd { margin: 0; }
#info ul { margin: 8px 0; padding-left: 18px; font-size: .82rem; }
#info li { margin: 3px 0; }
#info .place { font-size: .82rem; color: var(--muted); }
#infoClose { position: absolute; top: 8px; right: 8px; padding: 0 8px; font-size: 1.1rem; line-height: 1.5; }
/* the menu folds into its hamburger button */
.phead { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#collapse { padding: 5px 7px; line-height: 0; }
#collapse .ic { color: var(--fg); stroke-width: 1.6; }
#panel.min { width: auto; padding: 6px; }
#panel.min > :not(.phead), #panel.min .phead > :not(#collapse) { display: none; }
#cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); pointer-events: none; }
#prompt { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); background: var(--scrim);
  color: #fff; padding: 4px 10px; border-radius: 6px; font-size: .85rem; pointer-events: none; white-space: nowrap; }
#prompt kbd { font: 600 .8rem ui-monospace, Menlo, monospace; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20; }
#loading .box { width: min(360px, calc(100vw - 32px)); display: grid; gap: 10px; text-align: center; }
#loading .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
#loading .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#loading p { margin: 0; color: var(--muted); font-size: .85rem; }
#stick { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
  width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(0,0,0,.18); }
#stick > div { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,255,255,.7); }
#hint { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--scrim); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: .85rem; pointer-events: none; }

/* ---- press and hold ring, toast, info card extras */
#hold { position: fixed; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; pointer-events: none; z-index: 7;
  border: 3px solid #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(0,0,0,.45); animation: hold .45s ease-out forwards; }
@keyframes hold { from { transform: scale(.25); opacity: 0; } 30% { opacity: .9; } to { transform: scale(1); opacity: .9; } }
#info details { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 8px 0 0; margin-top: 10px; }
#info details > summary { padding: 4px 0; }
#info details ul { margin-top: 4px; }
#info .links a { color: var(--accent); }
#toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--scrim); color: #fff;
  padding: 7px 14px; border-radius: 999px; font-size: .85rem; pointer-events: none; z-index: 8; max-width: calc(100vw - 24px); text-align: center; }
.sheethead, #bar, #fCrouch { display: none; }
.biglist { display: none; }
canvas, #bar, #stick, #fCrouch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

/* ---- compact layout: phones, and tablets or phones held sideways. The model fills the screen, a toolbar sits along
   the bottom, and Layers and More open as sheets above it. */
body.compact { --bar: calc(58px + env(safe-area-inset-bottom)); }
body.compact #bar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: var(--bar); padding: 0 max(4px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left));
  background: var(--panel); border-top: 1px solid var(--line); backdrop-filter: blur(8px); touch-action: manipulation; }
#bar button { border: 0; border-radius: 10px; margin: 5px 2px; padding: 0; display: grid; justify-items: center; align-content: center; gap: 2px;
  font-size: .68rem; color: var(--muted); min-width: 0; }
#bar button .ic { width: 22px; height: 22px; color: inherit; }
#bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
body.compact .desk, body.compact #collapse { display: none !important; }
body.compact #panel { display: none; top: auto; left: 8px; right: 8px; width: auto; bottom: calc(var(--bar) + 8px);
  max-height: 66dvh; border-radius: 14px; padding: 10px 14px 14px; gap: 12px; z-index: 9; touch-action: pan-y; overscroll-behavior: contain; }
body.compact #panel[data-sheet="layers"], body.compact #panel[data-sheet="more"] { display: grid; }
body.compact #panel > [data-sec] { display: none; }
body.compact #panel[data-sheet="layers"] > [data-sec="layers"], body.compact #panel[data-sheet="more"] > [data-sec="more"] { display: grid; }
body.compact .sheethead { display: flex; align-items: center; }
.sheethead h2 { font: 600 1rem var(--display); margin: 0; flex: 1; }
#sheetClose { font-size: 1.2rem; line-height: 1; padding: 6px 12px; }
body.compact #panel button, body.compact #modal button { min-height: 40px; padding: 8px 14px; font-size: .9rem; }
body.compact #panel .row { gap: 8px; }
body.compact #detents { display: grid; grid-template-columns: 1fr 1fr; }
body.compact #detents button { font-size: .85rem; }
body.compact input[type=range] { height: 32px; }
body.compact details#layers { border: 0; padding: 0; }
body.compact details#layers > summary { display: none; }
body.compact #panel fieldset { border: 0; padding: 0; gap: 4px; position: relative; }
body.compact #slicelbl { position: absolute; right: 0; top: -21px; }
body.compact #panel fieldset legend { padding: 0; }
body.compact #detents { gap: 6px; }
body.compact #detents button { min-height: 36px; padding: 4px 8px; }
body.compact details#layers > summary::-webkit-details-marker { display: none; }
body.compact .layers { grid-template-columns: 1fr 1fr; gap: 2px 8px; }
body.compact .layer { min-height: 36px; padding: 4px 6px; font-size: .9rem; }
body.compact .layer.sub { margin-left: 0; }
body.compact .layer input { width: 20px; height: 20px; }
body.compact .biglist { display: grid; gap: 8px; }
body.compact .biglist button { text-align: left; }
body.compact #info { top: auto; left: 8px; right: 8px; width: auto; bottom: calc(var(--bar) + 8px); max-height: 42dvh; border-radius: 14px; z-index: 9; overscroll-behavior: contain; }
body.compact #infoClose { padding: 6px 12px; font-size: 1.2rem; line-height: 1; }
body.compact #info h2 { margin-right: 44px; }
body.compact #stick { bottom: calc(var(--bar) + 18px); left: max(18px, env(safe-area-inset-left)); touch-action: none; }
body.compact #fCrouch:not([hidden]) { display: block; position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(var(--bar) + 18px); z-index: 4;
  min-height: 44px; padding: 8px 16px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(6px); }
body.compact #modal { padding: 8px; align-items: end; }
body.compact .plan text { font-size: 1.7px; }
body.compact .plan text.small { font-size: 1.25px; }
body.compact #modal .sheet { max-height: calc(100dvh - 16px - env(safe-area-inset-top)); padding: 12px; }
body.compact #modalClose { font-size: 1.3rem; padding: 4px 14px; }
body.compact .keys td:first-child { white-space: normal; }
@media (max-height: 520px) { body.compact #panel, body.compact #info { left: auto; width: min(380px, calc(100vw - 16px)); max-height: calc(100dvh - var(--bar) - 16px); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/",
  "three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js"
} }
</script>
</head>
<body>
<div id="loading"><div class="box">
  <div class="eyebrow" style="font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)">Loading model</div>
  <div class="bar"><div id="bar"></div></div>
  <p id="loadmsg">Starting</p>
</div></div>

<div id="panel">
  <div class="phead desk">
    <button id="collapse" title="Hide the menu" aria-label="Menu" aria-expanded="true"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <button data-act="rooms" title="Pick a room on the floor plan">Go to a room</button>
    <button data-act="equip" title="Pick an appliance or a piece of equipment on the plan" hidden>Find equipment</button>
    <button data-act="controls" title="Keys and gestures (H)">Controls</button>
  </div>
  <div class="sheethead"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close">×</button></div>
  <fieldset data-sec="more">
    <legend>View</legend>
    <div class="row">
      <button class="desk" data-mode="orbit" aria-pressed="true" title="Drag to turn, scroll to zoom, W A S D to slide, Space and Shift to rise and sink">Orbit</button>
      <button class="desk" data-mode="walk" aria-pressed="false" title="Walk through the house at eye height">Walk</button>
      <button id="tClip" aria-pressed="false" title="Fly through walls (N)">No clip</button>
      <button data-act="crouch" aria-pressed="false" title="Crouch (C)" hidden>Crouch</button>
    </div>
    <div class="row" role="group" aria-label="Time of day">
      <button id="tDay" aria-pressed="true">Day</button>
      <button id="tNight" aria-pressed="false" title="Turn the sun off and the room lights on">Night</button>
    </div>
  </fieldset>
  <fieldset data-sec="layers">
    <legend>Height slice</legend>
    <label class="stack"><input id="slice" type="range" min="0.5" max="23" step="0.05" value="23" list="sliceticks" aria-label="Cut the house at this height"> <span id="slicelbl">Whole house</span></label>
    <datalist id="sliceticks"></datalist>
    <div class="row" id="detents" role="group" aria-label="Levels"></div>
  </fieldset>
  <details id="layers" open data-sec="layers">
    <summary>Layers</summary>
    <div class="layers">
      <label class="layer" id="rowRoof" title="Roof, fascia, gutters and ceilings"><input type="checkbox" id="lRoof" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5 8 2.5l6.5 6"/><path d="M4 7.5V13h8V7.5"/></svg> <span>Roof</span></label>
      <label class="layer" id="rowWalls" title="Off: walls, floors and furniture fade so the systems read"><input type="checkbox" id="lWalls" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12M2 10h12M6 3v3.5M10 6.5V10M6 10v3"/></svg> <span>Walls</span></label>
      <label class="layer" id="rowFurniture" title=""><input type="checkbox" id="lFurniture" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7V12M13.5 7V12M2.5 9.5h11M4 9.5V5.5h8v4"/></svg> <span>Furniture</span></label>
      <label class="layer" id="rowAppliances" title=""><input type="checkbox" id="lAppliances" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="1.8" width="8" height="12.4" rx="1"/><path d="M4 6.5h8M6 3.8v1.4M6 8.5v2"/></svg> <span>Appliances</span></label>
      <label class="layer" id="rowVehicles" title="The cars in the garage"><input type="checkbox" id="lVehicles" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 10.5V8.2l1.6-3.2h9.8l1.6 3.2v2.3z"/><circle cx="4.5" cy="11" r="1.4"/><circle cx="11.5" cy="11" r="1.4"/></svg> <span>Cars</span></label>
      <label class="layer" id="rowTrees" title="Trees, shrubs and the woods"><input type="checkbox" id="lTrees" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 3.5 9h9z"/><path d="M8 9v5"/></svg> <span>Trees</span></label>
      <label class="layer" id="rowDucts" title="Supply, return and fresh air ducts"><input type="checkbox" id="lDucts" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 6h9v4h-9z"/><path d="M10.5 8H15M12.8 5.8 15 8l-2.2 2.2"/></svg> <span>Ducts</span></label>
      <label class="layer sub" id="rowXray" title="Colour the ducts (blue supply, red return, green fresh air, purple exhaust) and show them through everything"><input type="checkbox" id="lXray"> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12" stroke="#3B82C4"/><path d="M2 8h12" stroke="#C4473B"/><path d="M2 12h12" stroke="#3F9B57"/></svg> <span>Duct x-ray</span></label>
      <label class="layer" id="rowMechanical" title="Heat pump, ERV, water heater, geothermal"><input type="checkbox" id="lMechanical" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 8 8 3.2M8 8l4.2 2.4M8 8l-4.2 2.4"/></svg> <span>Mechanical</span></label>
      <label class="layer" id="rowTrusses" title=""><input type="checkbox" id="lTrusses" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h14M1 12h14M1.5 12 4.5 4 7.5 12 10.5 4 13.5 12"/></svg> <span>Floor trusses</span></label>
      <label class="layer" id="rowUtil" title="Geothermal loops and septic"><input type="checkbox" id="lUtil" checked> <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5h14"/><path d="M2 10h12" stroke-dasharray="2 1.6"/><path d="M3 5v2M8 5v2M13 5v2" stroke-width="1"/></svg> <span>Buried lines</span></label>
    </div>
  </details>
  <div class="biglist" data-sec="more">
    <button data-act="equip" hidden>Find equipment</button>
    <button data-act="controls">Controls and gestures</button>
  </div>
</div>

<nav id="bar" aria-label="Tools">
  <button data-mode="orbit" aria-pressed="true"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="1.8"/><ellipse cx="8" cy="8" rx="6.5" ry="3"/></svg><span>Orbit</span></button>
  <button data-mode="walk" aria-pressed="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8.5" cy="2.8" r="1.3"/><path d="M8.5 5v4.5l2 4.5M8.5 9.5 6 14M5.5 7.8l3-2.3 2.6 2.4"/></svg><span>Walk</span></button>
  <button data-act="rooms"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11"/><path d="M8 2.5v5M2 8.5h4M10 8.5h4M8 10.5v3"/></svg><span>Rooms</span></button>
  <button data-sheet="layers" aria-pressed="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 1.8 5.2 8 8.4l6.2-3.2z"/><path d="M1.8 8 8 11.2 14.2 8M1.8 10.8 8 14l6.2-3.2"/></svg><span>Layers</span></button>
  <button data-sheet="more" aria-pressed="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12.5" cy="8" r=".8"/></svg><span>More</span></button>
</nav>
<button id="fCrouch" data-act="crouch" aria-pressed="false" hidden>Crouch</button>
<div id="toast" hidden role="status"></div>
<div id="hold" hidden></div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="mhead"><h2 id="modalTitle"></h2><div class="row" id="modalTools"></div><button id="modalClose" aria-label="Close" title="Close (Esc)">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<aside id="info" hidden aria-live="polite">
  <button id="infoClose" title="Close (Esc)" aria-label="Close">×</button>
  <div id="infoBody"></div>
</aside>

<div id="cross" hidden></div>
<div id="prompt" hidden><kbd>E</kbd><span id="promptTxt">Open</span></div>
<div id="stick" hidden><div></div></div>
<div id="hint" hidden>Click to look around. <kbd>H</kbd> for controls</div>

<script type="module" src="./app.js"></script>
</body>
</html>
