# Heilman-Mullin Residence, 1671 State Route 343
# Single source of truth for the 3D model. Edit a value, then rebuild:
#   python model/make_house.py          (walkthrough house, site/models/house.json)
#   python model/make_equipment.py      (appliances, equipment, ducts, site/models/equipment.json)
# Units are FEET unless noted. Plan origin = outside NW corner of the house slab,
# +x = east, +y = SOUTH (same as reading the plan sheet), z = height above slab.
# Source for every number is noted. "ASSUMED" means not on the plans yet: confirm or change.

[project]
name = "Heilman-Mullin Residence"
plan_set = "Moonlight Architecture sealed set 06/14/2026"
true_north_offset_deg = 0.0     # drone photos show plan north = true north within ~0.5 deg

# ---------------------------------------------------------------- HOUSE SHELL
[house]
width_x = 43.0833               # 43'-1" (A-11)
depth_y = 52.0                  # 52'-0" (A-11)
ext_wall_thickness = 0.5417     # 6-1/2" SIP (A-11 notes)
int_wall_source = "data/traced_geometry.json"   # interior walls pulled from A-11 vector data
slab_thickness = 0.333

[roof]
north_wall_height = 9.0         # 9'-0" panel height (A-30)
north_pitch = 3.82              # rise per 12. Was 3.88 on A-30, revised 9/15/2026 (Andy Roehl email)
clerestory_wall_y = 34.616      # north face of the clerestory bearing wall (A-11 / A-12)
south_wall_height = 11.0        # 11'-0" panel height (A-30)
south_pitch = 2.0               # 2:12 (A-13)
panel_thickness = 0.854         # 10-1/4" roof SIP (A-13)
overhang = 1.0                  # 12" O.H. (A-13)
fascia_height = 1.0             # 12" fascia (A-20 notes)
roofing = "standing_seam"       # standing seam metal (Maxwell)
seam_spacing_in = 16.0          # ASSUMED 16" panels, 1" ribs

[ceilings]
flat_height = 9.0               # 9'-0" CLG rooms (A-11). Everything else is vaulted to the roof.
# [x_min, y_min, x_max, y_max] for each flat 9' ceiling room
flat_rooms = [
  [0.5, 10.95, 12.12, 22.41],   # Bed 3
  [12.12, 10.95, 23.4, 15.03],  # Hall 2
  [23.4, 10.95, 30.25, 15.03],  # Hall 2 east leg to the master bedroom door: 9' ceiling + attic over it (Maxwell 11/13). Stops at bedroom 1's west wall, moved from x 28.12 to 30.25 (Maxwell 11/19/2026)
  # South edges at 22.86, just behind the living room's north wall face (22.866): at 22.87 the ceiling and attic deck poked
  # through that wall into the living room (Maxwell, 11/19/2026)
  [12.12, 15.03, 16.66, 22.86], # Hall 2 / linen
  [16.66, 15.03, 28.12, 22.86], # Laundry (mech platform above)
  [28.12, 15.49, 31.12, 22.86], # Laundry east end, south of bedroom 1's south wall (y 15.03-15.49)
  [31.12, 15.49, 42.5, 22.86],  # Closet 1. Starts at the attic side of bedroom 1's south wall: from 15.03 the deck showed through the bedroom's vaulted wall (Maxwell, 11/18/2026)
  [0.5, 22.86, 12.12, 29.03],   # Utility
  [0.5, 29.03, 12.12, 34.62],   # Pantry + Powder
]
attic_floor = true              # walkable attic deck on top of every flat ceiling; decks bridge over walls between flat rooms (one attic). ASSUMED
walls_stop_at_attic = true      # interior walls with flat ceilings on both sides stop at the attic deck (Maxwell 11/13)

[floor_trusses]                 # open web floor trusses under the attic deck and the loft (builder's choice, so returns can be ducted)
depth_in = 11.875               # 11-7/8" (Maxwell 11/16/2026)
deck_in = 0.75                  # ASSUMED 3/4" decking
spacing_in = 24.0               # ASSUMED
span = "ns"                     # ASSUMED north to south, until the truss drawings exist
max_round_duct_in = 6.0        # largest round duct through the webs. Builder, 11/18/2026: the trusses are in, 6 in fits, 7 in only maybe
grid_x0 = 0.7                   # ASSUMED: every truss on one 24 in grid from here (plan ft), so the bays line up house wide

[loft]                          # 134 sf loft over Bath 1 (A-12)
enabled = true
rect = [31.12, 22.87, 42.5, 34.62]
floor_height = 10.052           # 9' plate + 11-7/8" open web trusses + 3/4" subfloor (Maxwell 11/16/2026). Was 9.9 with the 2x10 floor on A-30
pony_wall_height = 0.0          # Maxwell 11/13: wall stops level with the loft floor (A-12 showed a high pony wall), railing above
railing = true                  # 36" guard along the open loft edge and handrails up the ships ladder. ASSUMED
railing_height = 3.0
railing_style = "steel_oak"     # black steel posts and balusters, white oak cap. ASSUMED
ships_ladder = [27.7, 32.0, 31.12, 34.56]   # footprint from A-11, rises toward the east
attic_access = { east_gap = 1.0, width = 2.96 }   # walk through opening in the loft north wall onto the attic deck: east edge 1 ft off the inside face of the east wall (Maxwell, 11/19/2026). Width kept from the A-11 gap (x 34.37-37.33) that used to be the way in, now walled above the loft floor

